name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_DB_SETUP: "true"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/catalyst_studio"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/catalyst_studio"
      IMPORT_MODEL_CHAIN: "x-ai/grok-4.1-fast"
      STUDIO_DISABLE_WORKFLOW_PLUGIN: "true"
      WORKFLOW_INTERNAL_SECRET: "ci-workflow-internal-secret"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Generate component registry
        run: npm run build:components

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      # The importer's own suites. They were not covered by test:ci, which names
      # its files one by one, so a dependency bump silently stopped them loading
      # and nothing noticed. Suites that already fail on main are excluded by
      # path inside the script; shorten that list as they get fixed.
      - name: Importer tests
        run: npm run test:import

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: STUDIO_DISABLE_WORKFLOW_PLUGIN=true npm run build

  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify Docker quickstart
        run: npm run verify:quickstart

      - name: Verify headless browser in app image
        run: |
          docker build -t catalyst-studio-headless-check .
          npx tsc scripts/check-headless-browser.ts --rootDir . --outDir "$RUNNER_TEMP/headless-check" --module commonjs --target ES2017 --esModuleInterop --skipLibCheck
          docker run --rm --network none \
            --mount "type=bind,source=$RUNNER_TEMP/headless-check,target=/app/headless-check,readonly" \
            catalyst-studio-headless-check node headless-check/scripts/check-headless-browser.js
